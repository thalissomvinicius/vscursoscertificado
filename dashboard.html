<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Painel | VS Cursos</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workspace.css"><script defer src="lucide.min.js"></script><script defer src="jspdf.umd.min.js"></script><script defer src="jszip.min.js"></script><script defer src="ui.js"></script><script defer src="dashboard.js"></script></head>
<body><header id="appHeader" class="app-header"></header><main class="management-shell">
<div class="page-heading"><div><span class="section-kicker">VS CURSOS</span><h1 id="pageTitle">Visão geral</h1><p class="muted" id="todayLabel"></p></div><a class="button primary" href="index.html"><i data-lucide="plus"></i>Novo certificado</a></div>
<section id="overview"><div id="metrics" class="metrics-grid" aria-label="Indicadores"><p class="muted">Carregando indicadores…</p></div><div class="overview-grid"><section class="course-summary"><div class="section-heading"><h2>Emissões por curso</h2><span class="muted">Ativos</span></div><div id="courseChart"></div></section><section class="recent-summary"><div class="section-heading"><h2>Atividade recente</h2><a href="#history" class="text-link">Ver todos <i data-lucide="arrow-right"></i></a></div><div id="recentCertificates"></div></section></div></section>
<section id="historySection" class="history-section"><div class="section-heading"><div><h2>Certificados</h2><p class="muted" id="historyCount">Carregando…</p></div><div class="heading-actions"><button id="exportReport" class="button secondary"><i data-lucide="file-text"></i>Relatório PDF</button><button id="exportCsv" class="icon-button bordered" title="Exportar CSV" aria-label="Exportar CSV"><i data-lucide="sheet"></i></button><button id="refreshHistory" class="icon-button bordered" title="Atualizar registros" aria-label="Atualizar registros"><i data-lucide="refresh-cw"></i></button></div></div>
<form class="filter-bar" id="historyFilters"><label class="search-field"><span class="sr-only">Buscar certificado</span><i data-lucide="search"></i><input id="search" type="search" placeholder="Aluno, CPF, empresa ou código" maxlength="200"></label><label><span class="sr-only">Situação</span><select id="filterStatus"><option value="">Todas as situações</option><option value="issued">Emitidos</option><option value="draft">Rascunhos</option><option value="revoked">Cancelados</option></select></label><label><span class="sr-only">Curso</span><select id="filterCourse"><option value="">Todos os cursos</option><option value="nr12">NR 12</option><option value="nr18">NR 18</option><option value="nr33">NR 33</option><option value="nr35">NR 35</option><option value="betoneira">Betoneira</option><option value="mecanico-industrial">Mecânico Industrial</option><option value="custom">Outros cursos</option></select></label><label>Criação de<input id="filterFrom" type="date"></label><label>Até<input id="filterTo" type="date"></label><button type="button" id="clearFilters" class="icon-button" title="Limpar filtros" aria-label="Limpar filtros"><i data-lucide="filter-x"></i></button></form>
<div id="selectionToolbar" class="selection-toolbar hidden"><span id="selectionCount"></span><button id="issueSelected" class="button primary"><i data-lucide="files"></i>Emitir rascunhos</button><button id="zipSelected" class="button secondary"><i data-lucide="archive"></i>Baixar PDFs em ZIP</button><button id="clearSelection" class="icon-button" title="Limpar seleção" aria-label="Limpar seleção"><i data-lucide="x"></i></button><span id="batchProgress" class="batch-progress" role="status"></span><button id="stopBatch" class="text-button hidden">Interromper</button></div>
<div class="table-scroll"><table class="records-table"><thead><tr><th><input type="checkbox" id="selectPage" aria-label="Selecionar esta página"> Aluno / empresa</th><th>Curso</th><th>Data / período</th><th>Situação</th><th>Atualizado</th><th class="actions-column">Ações</th></tr></thead><tbody id="certificateRows"><tr><td colspan="6">Carregando registros…</td></tr></tbody></table></div><div class="pagination"><span id="pageInfo"></span><div><button id="previousPage" class="icon-button bordered" title="Página anterior" aria-label="Página anterior"><i data-lucide="chevron-left"></i></button><button id="nextPage" class="icon-button bordered" title="Próxima página" aria-label="Próxima página"><i data-lucide="chevron-right"></i></button></div></div>
</section></main><footer class="developer-credit">Desenvolvido por Vinicius Dev</footer></body></html>
