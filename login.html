<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso | VS Cursos</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workspace.css">
  <script defer src="lucide.min.js"></script><script defer src="ui.js"></script><script defer src="login.js"></script>
</head>
<body class="access-body">
  <main class="access-layout">
    <section class="access-brand"><img src="logo.svg" alt="VS Cursos" width="260" height="72"><p class="access-company">CNPJ 60.953.721/0001-48</p></section>
    <section class="access-form"><span class="section-kicker" id="loginKicker">BEM-VINDO</span><h2 id="loginTitle">Acesse sua conta</h2>
      <p id="loginDetail" class="muted"></p>
      <form id="loginForm" class="form-stack">
        <label id="nameWrap" class="hidden">Seu nome<input id="loginName" type="text" autocomplete="name" maxlength="120"></label>
        <label>Usuário<input id="loginUser" type="text" autocomplete="username" required maxlength="64" autofocus></label>
        <label>Senha<div class="password-field"><input id="loginPassword" type="password" autocomplete="current-password" required maxlength="200"><button type="button" class="icon-button" id="showPassword" title="Mostrar senha" aria-label="Mostrar senha"><i data-lucide="eye"></i></button></div></label>
        <label id="confirmationWrap" class="hidden">Confirme a senha<input id="loginConfirmation" type="password" autocomplete="new-password" maxlength="200"></label>
        <p id="loginError" class="inline-error" role="alert"></p><button class="button primary" id="loginSubmit" type="submit">Entrar <i data-lucide="arrow-right"></i></button>
      </form>
    </section>
  </main><footer class="developer-credit">Desenvolvido por Vinicius Dev</footer>
</body></html>
